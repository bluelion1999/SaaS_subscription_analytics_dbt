version: 2

models: 
  - name: subscription_mrr_movements
    description: One row per subscription, describing subscription/mrr movement.
    config:
      grants:
        select: ["svc_gtm_ai_role"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - subscription_id
              - effective_date
      - reconciles_to_running_total:
          arguments:
            column_name: current_mrr_amount
            delta_column: mrr_delta
            partition_by: subscription_id
            order_by: effective_date

    columns:
      - name: subscription_id
        data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_subscriptions_current')
              field: subscription_id
      - name: movement_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new','reactivation', 'expansion', 'contraction', 'at_risk', 'churn']
      - name: effective_date
        data_tests:
          - not_null

  - name: fct_invoices
    description: >
      One row per invoice. collected_amount/lost_amount/refunded_amount are
      mutually exclusive buckets that sum back to amount, so any one of them
      can be summed over a period with no WHERE clause.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscriptions_current')
                field: subscription_id
      - name: invoice_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'failed', 'refunded']

  - name: subscription_engagement_summary
    description: >
      One row per subscription with usage aggregates from fct_product_events.
      Only covers subscriptions that had at least one eligible event during
      simulate_time_passing.py's runs -- canceled subscriptions may have no
      row here at all.
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscriptions_current')
                field: subscription_id
